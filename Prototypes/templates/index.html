<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photobooth</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #252525,
                    #111 60%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 900px;

            text-align: center;
        }


        h1 {

            margin-top: 0;

            margin-bottom: 20px;

            font-size: 36px;

            letter-spacing: 4px;
        }


        /* ==================================================
           CAMERA DISPLAY
           ================================================== */

        .preview-container {

            position: relative;

            width: 100%;

            background: black;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.5);
        }


        #liveview {

            display: block;

            width: 100%;

            height: auto;

            min-height: 400px;

            object-fit: contain;

            background: black;
        }


        #collageImg {

            display: none;

            width: 100%;

            height: auto;

            background: white;
        }


        #cameraOff {

            display: none;

            padding: 150px 20px;

            color: #aaa;

            font-size: 20px;
        }


        /* ==================================================
           COUNTDOWN
           ================================================== */

        #countdownOverlay {

            display: none;

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(
                -50%,
                -50%
            );

            font-size: 150px;

            font-weight: bold;

            text-shadow:
                0 0 20px black,
                0 0 40px black;

            z-index: 10;
        }


        /* ==================================================
           STATUS
           ================================================== */

        #status {

            margin-top: 15px;

            min-height: 24px;

            font-size: 18px;

            color: #ccc;
        }


        /* ==================================================
           BUTTONS
           ================================================== */

        .buttons {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 12px;

            margin-top: 20px;
        }


        button {

            border: none;

            border-radius: 8px;

            padding: 15px 25px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #333;

            color: white;

            transition:
                transform 0.15s,
                background 0.15s;
        }


        button:hover:not(:disabled) {

            transform: translateY(-2px);

            background: #555;
        }


        button:disabled {

            opacity: 0.35;

            cursor: not-allowed;
        }


        #connectBtn {

            background: #1976d2;
        }


        #startBtn {

            background: #2e7d32;
        }


        #takeBtn {

            background: #6a1b9a;
        }


        #disconnectBtn {

            background: #c62828;
        }


        #retakeBtn {

            background: #ef6c00;

            display: none;
        }


        #printBtn {

            background: #00897b;

            display: none;
        }


        #previewBtn {

            background: #455a64;
        }


        /* ==================================================
           COLLAGE MODE
           ================================================== */

        .collage-controls {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 20px;

            flex-wrap: wrap;
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            h1 {

                font-size: 25px;

                letter-spacing: 2px;
            }

            button {

                width: 100%;
            }

            .buttons {

                flex-direction: column;
            }

            #countdownOverlay {

                font-size: 100px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <h1>📸 PHOTOBOOTH</h1>


    <div class="preview-container">

        <img
            id="liveview"
            alt="Camera Live View"
        >

        <img
            id="collageImg"
            alt="Latest Photobooth Collage"
        >

        <div id="cameraOff">
            Camera disconnected
        </div>

        <div id="countdownOverlay">
            3
        </div>

    </div>


    <div id="status">
        Camera not connected.
    </div>


    <!-- MAIN CONTROLS -->

    <div class="buttons">

        <button
            id="connectBtn"
            onclick="connectCamera()"
        >
            CONNECT CAMERA
        </button>


        <button
            id="startBtn"
            onclick="startSession()"
            disabled
        >
            START SESSION
        </button>


        <button
            id="takeBtn"
            onclick="manualTakePhoto()"
            disabled
        >
            TAKE PHOTO
        </button>


        <button
            id="previewBtn"
            onclick="previewLastCollage()"
        >
            PREVIEW LAST COLLAGE
        </button>


        <button
            id="disconnectBtn"
            onclick="disconnectCamera()"
            disabled
        >
            DISCONNECT
        </button>

    </div>


    <!-- COLLAGE CONTROLS -->

    <div class="collage-controls">

        <button
            id="retakeBtn"
            onclick="retakeSession()"
        >
            🔄 RETAKE
        </button>


        <button
            id="printBtn"
            onclick="printCollage()"
        >
            🖨️ PRINT
        </button>

    </div>


</div>



<script>


// ============================================================
// ELEMENTS
// ============================================================

const liveview =
    document.getElementById("liveview");

const collageImg =
    document.getElementById("collageImg");

const cameraOff =
    document.getElementById("cameraOff");

const countdownOverlay =
    document.getElementById("countdownOverlay");

const statusText =
    document.getElementById("status");

const connectBtn =
    document.getElementById("connectBtn");

const startBtn =
    document.getElementById("startBtn");

const takeBtn =
    document.getElementById("takeBtn");

const previewBtn =
    document.getElementById("previewBtn");

const disconnectBtn =
    document.getElementById("disconnectBtn");

const retakeBtn =
    document.getElementById("retakeBtn");

const printBtn =
    document.getElementById("printBtn");


// ============================================================
// STATUS
// ============================================================

function setStatus(message) {

    statusText.textContent = message;
}


// ============================================================
// CONNECT CAMERA
// ============================================================

async function connectCamera() {

    setStatus("Connecting to camera...");

    connectBtn.disabled = true;

    try {

        const response =
            await fetch(
                "/connect",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        liveview.src =
            "/liveview";


        liveview.style.display =
            "block";

        collageImg.style.display =
            "none";

        cameraOff.style.display =
            "none";


        startBtn.disabled =
            false;

        takeBtn.disabled =
            false;

        disconnectBtn.disabled =
            false;


        setStatus(
            "Camera connected."
        );

    }

    catch (error) {

        connectBtn.disabled =
            false;

        setStatus(
            "Connection error: "
            + error.message
        );
    }
}


// ============================================================
// COUNTDOWN
// ============================================================

function showCountdown(seconds) {

    return new Promise(
        resolve => {

            let count = seconds;

            countdownOverlay.textContent =
                count;

            countdownOverlay.style.display =
                "block";


            const timer =
                setInterval(
                    () => {

                        count--;

                        if (count <= 0) {

                            clearInterval(timer);

                            countdownOverlay.style.display =
                                "none";

                            resolve();

                        } else {

                            countdownOverlay.textContent =
                                count;
                        }

                    },
                    1000
                );
        }
    );
}


// ============================================================
// START SESSION
// ============================================================

async function startSession() {

    await runPhotoSession();
}


// ============================================================
// RETAKE
// ============================================================

async function retakeSession() {

    retakeBtn.disabled =
        true;

    printBtn.disabled =
        true;


    // Return to live view

    collageImg.style.display =
        "none";

    liveview.style.display =
        "block";


    setStatus(
        "Starting a new session..."
    );


    await runPhotoSession();
}


// ============================================================
// PHOTO SESSION
// ============================================================

async function runPhotoSession() {

    startBtn.disabled =
        true;

    takeBtn.disabled =
        true;

    previewBtn.disabled =
        true;

    retakeBtn.style.display =
        "none";

    printBtn.style.display =
        "none";


    try {

        // Start session on server

        let response =
            await fetch(
                "/start-session",
                {
                    method: "POST"
                }
            );


        let data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        // Take 4 photos

        for (
            let i = 1;
            i <= 4;
            i++
        ) {

            setStatus(
                "Get ready for photo "
                + i
                + " of 4..."
            );


            await showCountdown(3);


            setStatus(
                "Taking photo "
                + i
                + " of 4..."
            );


            response =
                await fetch(
                    "/take-photo",
                    {
                        method: "POST"
                    }
                );


            data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.message
                );
            }


            // Small pause after photo

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        800
                    )
            );
        }


        // Create collage

        setStatus(
            "Creating your 4×6 photo..."
        );


        response =
            await fetch(
                "/make-collage",
                {
                    method: "POST"
                }
            );


        data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        // Show collage

        showCollage();


        setStatus(
            "Your photo is ready!"
        );


    }

    catch (error) {

        setStatus(
            "Error: "
            + error.message
        );


        startBtn.disabled =
            false;

        takeBtn.disabled =
            false;

        previewBtn.disabled =
            false;
    }
}


// ============================================================
// SHOW COLLAGE
// ============================================================

function showCollage() {

    liveview.style.display =
        "none";

    collageImg.style.display =
        "block";


    collageImg.src =
        "/collage-image?timestamp="
        + Date.now();


    retakeBtn.style.display =
        "inline-block";

    printBtn.style.display =
        "inline-block";


    retakeBtn.disabled =
        false;

    printBtn.disabled =
        false;


    previewBtn.disabled =
        false;
}


// ============================================================
// PREVIEW LAST COLLAGE
// ============================================================

async function previewLastCollage() {

    setStatus(
        "Checking for the latest collage..."
    );


    previewBtn.disabled =
        true;


    try {

        const response =
            await fetch(
                "/preview-last-collage"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        showCollage();


        setStatus(
            "Showing your last collage."
        );


    }

    catch (error) {

        setStatus(
            "No previous collage found."
        );

    }

    finally {

        previewBtn.disabled =
            false;
    }
}


// ============================================================
// PRINT
// ============================================================

async function printCollage() {

    printBtn.disabled =
        true;

    retakeBtn.disabled =
        true;


    setStatus(
        "🖨️ Sending photo to Canon SELPHY..."
    );


    try {

        const response =
            await fetch(
                "/print-collage",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        setStatus(
            "✅ Print job sent successfully!"
        );


    }

    catch (error) {

        setStatus(
            "❌ Printing error: "
            + error.message
        );

    }

    finally {

        printBtn.disabled =
            false;

        retakeBtn.disabled =
            false;
    }
}


// ============================================================
// MANUAL PHOTO
// ============================================================

async function manualTakePhoto() {

    takeBtn.disabled =
        true;


    setStatus(
        "Taking photo..."
    );


    try {

        const response =
            await fetch(
                "/take-photo",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        setStatus(
            "Photo taken: "
            + data.filename
        );

    }

    catch (error) {

        setStatus(
            "Error: "
            + error.message
        );

    }

    finally {

        takeBtn.disabled =
            false;
    }
}


// ============================================================
// DISCONNECT
// ============================================================

async function disconnectCamera() {

    setStatus(
        "Disconnecting camera..."
    );


    try {

        const response =
            await fetch(
                "/disconnect",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        liveview.src =
            "";

        liveview.style.display =
            "none";


        collageImg.style.display =
            "none";


        cameraOff.style.display =
            "block";


        connectBtn.disabled =
            false;

        startBtn.disabled =
            true;

        takeBtn.disabled =
            true;

        disconnectBtn.disabled =
            true;


        retakeBtn.style.display =
            "none";

        printBtn.style.display =
            "none";


        setStatus(
            "Camera disconnected."
        );

    }

    catch (error) {

        setStatus(
            "Error: "
            + error.message
        );
    }
}


</script>


</body>

</html>
