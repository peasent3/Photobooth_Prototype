<!doctype html>
<body class="bg-light">

<div class="container py-4">

    <!-- ============================================================= -->
    <!--                     HEADER – TITLE + DARK‑MODE               -->
    <!-- ============================================================= -->
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-5 fw-bold mb-0">🪄 Photobooth</h1>
            <p class="text-muted mb-0">Take 4 photos → 4×6″ collage</p>
        </div>

        <!-- Dark‑mode toggle (moon / sun) -->
        <button id="btnTheme" class="btn btn-outline-secondary" aria-label="Toggle dark mode">
            <i class="bi bi-moon-stars"></i>
        </button>
    </header>

    <!-- ============================================================= -->
    <!--                         PROGRESS BAR                         -->
    <!-- ============================================================= -->
    <div class="row mb-3">
        <div class="col-12">
            <div class="progress" role="progressbar" aria-label="Progress"
                 aria-valuemin="0" aria-valuemax="100" id="stepProgress">
                <div class="progress-bar bg-success" style="width: 0%"></div>
            </div>
            <small class="text-muted d-block text-center mt-1" id="stepLabel">
                Press **Connect** to start
            </small>
        </div>
    </div>

    <!-- ============================================================= -->
    <!--                         LIVE VIEW CARD                        -->
    <!-- ============================================================= -->
    <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-0 position-relative overflow-hidden">
                    <!-- MJPEG live‑view image -->
                    <img id="liveViewImg"
                         src="{{ url_for('liveview') }}"
                         class="img-fluid rounded"
                         alt="Live view from camera"
                         style="aspect-ratio: 4/3; object-fit: cover;">

                    <!-- Countdown overlay (hidden by default) -->
                    <div id="countdownOverlay"
                         class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
                         style="background: rgba(0,0,0,0.65); color:#fff; font-size:5rem; display:none;">
                        3
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================= -->
    <!--                         CONTROL BUTTONS                        -->
    <!-- ============================================================= -->
    <div class="row gy-3 text-center">

        <div class="col-6 col-md-3">
            <button id="btnConnect" class="btn btn-primary w-100">
                <i class="bi bi-plug"></i> Connect
            </button>
        </div>

        <div class="col-6 col-md-3">
            <button id="btnTake" class="btn btn-success w-100" disabled>
                <i class="bi bi-camera"></i> Take Photo
            </button>
        </div>

        <div class="col-6 col-md-3">
            <button id="btnPrint" class="btn btn-outline-primary w-100" disabled>
                <i class="bi bi-printer"></i> Print Collage
            </button>
        </div>

        <div class="col-6 col-md-3">
            <button id="btnDisconnect" class="btn btn-danger w-100" disabled>
                <i class="bi bi-power"></i> Disconnect
            </button>
        </div>

    </div>
</html>
