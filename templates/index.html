<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>📸 Photobooth – Live View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-ENjdO4Dr2bkBIFxQpeo1pZK2CZ6P7NQfXh6m2K0RkB1K5pPxMJ5eBjq3V0YzO+fJ"
          crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body class="bg-light">
<div class="container py-4">

    <h1 class="display-5 mb-4">🪄 Photobooth</h1>

    {% if connected %}
        <p class="text-success">✅ Camera is connected</p>
    {% else %}
        <p class="text-danger">❌ Camera is disconnected</p>
    {% endif %}

    <div class="row g-2 mb-4">
        <div class="col-auto">
            <form method="post" action="{{ url_for('connect') }}">
                <button type="submit" class="btn btn-primary"
                        {% if connected %}disabled{% endif %}>
                    Connect
                </button>
            </form>
        </div>
        <div class="col-auto">
            <form method="post" action="{{ url_for('disconnect') }}">
                <button type="submit" class="btn btn-danger"
                        {% if not connected %}disabled{% endif %}>
                    Disconnect
                </button>
            </form>
        </div>
    </div>

    <h3 class="mt-4 mb-3">Live view</h3>

    {% if connected %}
        <img src="{{ url_for('liveview') }}" class="img-fluid rounded"
             alt="Live view from camera" style="max-width:100%; aspect-ratio:4/3;">
    {% else %}
        <!-- Placeholder image when the camera is not connected -->
        <img src="{{ url_for('static', filename='img/placeholder.jpg') }}"
             class="img-fluid rounded" alt="No live view"
             style="max-width:100%; aspect-ratio:4/3;">
    {% endif %}

</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">
</body>
</html>
